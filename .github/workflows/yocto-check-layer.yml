name: yocto-check-layer

on:
  pull_request:
  workflow_dispatch:

env:
  KAS_CLONE_DEPTH: 1
  # kas 5.5, the image the script below is taken from.
  KAS_CONTAINER_IMAGE: ghcr.io/siemens/kas/kas@sha256:4b210b0be3c887875973c4f4c35470b4ecf3edd2346c9de1bdd33feae5b86e94

jobs:
  check-layer:
    runs-on:
      group: GHA-prd-foundriesio-SelfHosted-RG
      labels: [ self-hosted, qcom-u2404, amd64 ]
    name: yocto-check-layer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up kas-container
        run: |
          KAS_CONTAINER=$RUNNER_TEMP/kas-container
          echo "KAS_CONTAINER=$KAS_CONTAINER" >> $GITHUB_ENV
          cid=$(docker create "$KAS_CONTAINER_IMAGE")
          docker cp "$cid:/usr/local/bin/kas-container" "$KAS_CONTAINER"
          docker rm "$cid"
          chmod +x "$KAS_CONTAINER"
          LATEST=$(git ls-remote --tags --refs --sort="v:refname" https://github.com/siemens/kas | tail -n1 | sed 's/.*\///')
          grep -q "KAS_CONTAINER_SCRIPT_VERSION=\"${LATEST}\"" "$KAS_CONTAINER" ||
            echo "::notice::kas ${LATEST} is released; move KAS_CONTAINER_IMAGE to its digest."

      - name: Run yocto-check-layer
        run: |
          ci/scripts/kas-container-shell-helper.sh ci/scripts/yocto-check-layer.sh
