# This file holds documentation for the variables meta-foundries recipes read.
# Update it whenever a recipe in this layer starts reading a new user-facing
# variable.

LMP_FACTORY_TAG[doc] = "Tag fio-device-register reads from /etc/os-release at registration time, restricting the device to Targets carrying it. The key name is fixed by the upstream binary, so it is spelled the same in the build configuration. Set it in the distro configuration along with OS_RELEASE_FIELDS += \"LMP_FACTORY_TAG\"; this layer leaves os-release alone to keep its signature stable, and ci/ sets a value for its own builds only. There is no environment variable fallback on the device, only the --tag (-t) option."
FIO_DEVICE_API[doc] = "Build-time default for the OTA device-registration API endpoint compiled into fio-device-register. On the device, the DEVICE_API environment variable overrides it."
FIO_OAUTH_API[doc] = "Build-time default for the OAuth endpoint compiled into fio-device-register. On the device, the OAUTH_BASE environment variable overrides it."
SOTA_CLIENT[doc] = "Name of the OTA client package. packagegroup-foundries-platform RDEPENDS on it, so the group installs whichever client the setting names; fio-device-register RDEPENDS on it and passes it to the upstream build as -DSOTA_CLIENT, which names the systemd service the tool starts after registration; fioconfig RDEPENDS on it and writes it into the SOTA_CLIENT line of its aktualizr-toml-update handler, which is the service the handler restarts after a configuration change. Defaults to aktualizr-lite, the client this layer provides. Set it in the distro configuration to ship a different client, or empty to leave the upstream \"aktualizr-lite\" default in both the compiled-in value and the handler, without the RDEPENDS that install the client."
OSTREE_OSNAME[doc] = "Name of the ostree deployment (stateroot), set by meta-updater and defaulting to nodistro there. A device gets its deployment under this name when it is flashed, and OTA updates never rename it. Set it before flashing the first device of a fleet: changing it later only affects devices flashed afterwards."
COMPOSE_HTTP_TIMEOUT[doc] = "Timeout in seconds the Docker Compose client uses, written into aktualizr-lite.service as the COMPOSE_HTTP_TIMEOUT environment variable. Defaults to 60."
PKCS11_ENGINE_PATH[doc] = "Path to the PKCS#11 engine aktualizr-lite loads, compiled in as -DPKCS11_ENGINE_PATH when the hsm PACKAGECONFIG is enabled. Defaults to the OpenSSL 3 engines directory under the library path. Distros pairing this layer with another OpenSSL build point it at the engine that build installs."
COMPOSE_APP_STORE_ROOT[doc] = "Directory composectl compiles in as its blob store for fetched Apps, where aktualizr-lite expects the reset-apps content. Defaults to /var/sota/reset-apps, under the storage directory the aktualizr-lite tmpfiles entry creates. A distro moving the sota storage sets this to match."
COMPOSE_APP_COMPOSE_ROOT[doc] = "Directory composectl compiles in as the location it writes App compose projects to, where aktualizr-lite expects to find them. Defaults to /var/sota/compose-apps, under the storage directory the aktualizr-lite tmpfiles entry creates. A distro moving the sota storage sets this to match."
COMPOSE_APP_MANAGER[doc] = "Packages providing the compose-app manager. packagegroup-foundries-containers RDEPENDS on them, and fio-device-register enables its composeapp PACKAGECONFIG when the list names composectl, so a single setting decides which manager an image handles Apps with. Defaults to composectl and its aklite-apps symlink, the manager this layer provides. An image leaving packagegroup-foundries-containers out takes ostree updates without Apps; set this empty as well to drop the App support compiled into the registration tool."
FIOCONFIG_HANDLERS[doc] = "Names of the upstream contrib scripts fioconfig installs into /usr/share/fioconfig/handlers, the only directory fioconfig runs an OnChanged handler from unless started with --unsafe-handlers. Defaults to aktualizr-toml-update and renew-client-cert, plus factory-config-vpn with the vpn PACKAGECONFIG and fioconfig-oneshot with the actions PACKAGECONFIG. A distro shipping its own handler adds the script to the recipe and appends its name here."
FIOCONFIG_ACTIONS[doc] = "Names of the upstream contrib scripts fioconfig installs into /usr/share/fioconfig/actions, the directory the daemon lists to tell the backend which remote actions this device offers. Defaults to diag and reboot with the actions PACKAGECONFIG, and is empty without it. Every action is reachable by any operator of the Factory, so a distro restricting that surface sets a shorter list."
DOCKER_MAX_CONCURRENT_DOWNLOADS[doc] = "Number of image layers dockerd downloads in parallel, written into the default daemon.json as max-concurrent-downloads. Defaults to 3. Applies only when DISTRO_FEATURES holds sota and virtualization, the condition for the docker-moby append. A file in /etc/docker/daemon.json on the device replaces the default one as a whole."
DOCKER_MAX_DOWNLOAD_ATTEMPTS[doc] = "Number of times dockerd tries a layer download before failing the pull, written into the default daemon.json as max-download-attempts. Defaults to 5. Applies only when DISTRO_FEATURES holds sota and virtualization, the condition for the docker-moby append. A file in /etc/docker/daemon.json on the device replaces the default one as a whole."
FOUNDRIES_SANITY_SKIP[doc] = "Set to 1 to disable every foundries-sanity check, for bring-up builds. Defaults to 0. The class then prints one warning and lets the build go ahead."
